<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/>

  <!-- Grid pattern background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Background Dynamic / Animated Elements (Positioned behind text and glow) -->
  <g opacity="0.25">
    <!-- Robotic Arm Schematic Path -->
    <path d="M 100 300 L 250 200 L 400 240 L 550 120" stroke="#6366f1" stroke-width="4" fill="none" stroke-dasharray="8 4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
    </path>
    <circle cx="250" cy="200" r="8" fill="#a855f7"/>
    <circle cx="400" cy="240" r="8" fill="#ec4899"/>
    
    <!-- Waveform / Data Flow -->
    <path d="M 650 280 Q 750 180 850 260 T 1050 200" stroke="#38bdf8" stroke-width="3" fill="none">
      <animate attributeName="d" 
        values="M 650 280 Q 750 180 850 260 T 1050 200; M 650 260 Q 750 280 850 200 T 1050 250; M 650 280 Q 750 180 850 260 T 1050 200" 
        dur="6s" repeatCount="indefinite"/>
    </path>
    
    <!-- Floating Tech Spheres -->
    <circle cx="980" cy="100" r="40" fill="#a855f7" opacity="0.15" filter="url(#glow)">
      <animate attributeName="cy" values="100;120;100" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="90" r="30" fill="#6366f1" opacity="0.2" filter="url(#glow)">
      <animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative Tech Cards in Corner (Background layer) -->
  <g transform="translate(900, 40)" opacity="0.4">
    <rect width="240" height="130" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">FLEET ORCHESTRATION</text>
    <rect x="20" y="50" width="140" height="8" rx="4" fill="#6366f1" opacity="0.6"/>
    <rect x="20" y="68" width="180" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="20" y="86" width="100" height="8" rx="4" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- Title & Foreground Content (Guaranteed clear & visible) -->
  <g transform="translate(80, 140)">
    <!-- Subtitle Pill -->
    <rect x="0" y="-60" width="350" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="16" y="-39" fill="#a5b4fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      🤖 CURATED INDUSTRIAL ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Industrial Robotics
    </text>
    <text x="0" y="75" fill="url(#accent-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Management Platforms
    </text>

    <!-- Subtitle Tagline -->
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      SaaS Platforms • Open-Source Stacks • Motion Planning • Fleet Simulation • Digital Twins
    </text>
  </g>
</svg>
